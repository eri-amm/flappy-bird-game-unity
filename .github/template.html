<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 1280px;
        height: 640px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      .card {
        text-align: center;
      }
      img.avatar {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        margin-bottom: 32px;
      }
      h1 {
        font-size: 64px;
        margin: 0;
      }
      p {
        font-size: 32px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        class="avatar"
        src="https://github.com/eri-amm.png"
        alt="avatar"
      />
      <h1>flappy-bird-game-unity</h1>
    </div>
  </body>
</html>
